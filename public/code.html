const isRep = (b) => { const d = BLOCKS[b.type]; return !!d && (d.shape === 'rep' || d.shape === 'bool'); };
const isCap = (b) => { const d = BLOCKS[b.type]; return !!d && (d.shape === 'cap' || d.cap); };

// ================= Code generator =================
const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
const q = (s) => JSON.stringify(String(s));
const ind = (s) => s.replace(/^(?=.)/gm, '  ');
const isNumStr = (s) => /^\s*-?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?\s*$/i.test(s);
function safeId(s, pre) {
  let r = String(s).trim().replace(/[^A-Za-z0-9_$]+(.)?/g, (m, ch) => (ch ? ch.toUpperCase() : ''));
  if (!r || /^\d/.test(r)) r = pre + r;
  return r;
}

class Gen {
  constructor(t, pretty) { this.t = t; this.pretty = !!pretty; this.loops = 0; this.n = 0; }
  uniq(p) { return p + '_' + (++this.n); }
  V(name) { return this.pretty && /^[A-Za-z_$][\w$]*$/.test(name) ? 'V.' + name : `V[${q(name)}]`; }
  fnOf(id) { return (this.t.functions || []).find(f => f.id === id); }
  list(blocks) { let s = ''; for (const b of blocks || []) s += this.stmt(b); return s; }
  stmt(b) {
    const d = BLOCKS[b.type];
    if (!d || !d.gen || d.shape === 'hat' || d.shape === 'rep' || d.shape === 'bool') return '';
    return d.gen(this.c(b));
  }
  expr(b) {
    const d = BLOCKS[b.type];
    if (!d || !d.gen) return '(0)';
    return '(' + d.gen(this.c(b)) + ')';
  }
  c(b) {
    const g = this, d = BLOCKS[b.type];
    return {
      b, g, pretty: g.pretty,
      V: (n) => g.V(n),
      uniq: (p) => g.uniq(p),
      f: (name) => { const v = (b.a || {})[name]; return v == null ? ((d.args[name] || {}).d ?? '') : v; },
      v: (name) => g.arg(b, name, d.args[name]),
      sub: (name) => ind(g.list((b.s || {})[name])),
      loopSub: (name) => { g.loops++; try { return ind(g.list((b.s || {})[name])); } finally { g.loops--; } },
      tick: () => (g.pretty ? '' : '  await $.tick();\n'),
      frame: () => (g.pretty ? '' : '  await $.frame();\n'),
    };
  }
  arg(b, name, spec) {
    spec = spec || { t: 't' };
    const r = b.r && b.r[name];
    if (r) {
      const e = this.expr(r);
      if (spec.t === 'n') return this.pretty ? e : `$.n${e}`;
      if (spec.t === 'b') return this.pretty ? e : `$.b${e}`;
      return e;
    }
    const raw = b.a && b.a[name] != null ? b.a[name] : (spec.d ?? '');
    const v = String(raw);
    switch (spec.t) {
      case 'n': { const x = parseFloat(v); if (!isFinite(x)) return '0'; return x < 0 ? `(${x})` : String(x); }
      case 't': { if (isNumStr(v)) { const x = parseFloat(v); return x < 0 ? `(${x})` : String(x); } return q(v); }
      case 'b': return 'false';
      case 'code': return v;
      default: return q(v);
    }
  }
  call(fn, b) {
    const args = fn.params.map(p => this.arg(b, p.id, { t: p.kind === 'b' ? 'b' : 't' }));
    if (this.pretty) return `${safeId(fn.name, 'f')}(${args.join(', ')})`;
    return `P[${q(fn.id)}]({${fn.params.map((p, i) => `${q(p.id)}: ${args[i]}`).join(', ')}})`;
  }
  defBody(fn, blocks) {
    this.loops = 0;
    let body = this.list(blocks);
    if (fn.warp && !this.pretty) body = `$.warp(1);\ntry {\n${ind(body)}} finally {\n  $.warp(-1);\n}\n`;
    return body;
  }
}

function compileTarget(t) {
  const out = { hats: [], defs: {}, errors: [] };
  const prev = CTX.target; CTX.target = t;
  try {
    const g = new Gen(t, false);
    for (const sc of t.scripts) {
      const first = sc.blocks[0];
      if (!first) continue;
      if (first.type === 'fn_def') {
        const fn = g.fnOf(first.a.FN);
        if (!fn) continue;
        const body = g.defBody(fn, sc.blocks.slice(1));
        try { out.defs[fn.id] = new AsyncFunction('S', '$', 'V', 'R', 'P', 'L', body); }
        catch (e) { out.errors.push(`“${fn.name}” block: ${e.message}`); }
        continue;
      }
      const d = BLOCKS[first.type];
      if (!d || !d.hat) continue;
      g.loops = 0;
      const body = 'const L = {};\n' + g.list(sc.blocks.slice(1));
      try {
        const fn = new AsyncFunction('S', '$', 'V', 'R', 'P', body);
        out.hats.push({ kind: d.hat, key: first.a.K, msg: first.a.M, fn, sid: sc.id });
      } catch (e) { out.errors.push(`A script in ${t.name}: ${e.message}`); }
    }
  } finally { CTX.target = prev; }
  for (const e of out.errors) R.log('⚠️ ' + e, 'err');
  return out;
}

function compileScript(t, sc) {
  const g = new Gen(t, false);
  const blocks = sc.blocks[0] && BLOCKS[sc.blocks[0].type] && BLOCKS[sc.blocks[0].type].shape === 'hat' ? sc.blocks.slice(1) : sc.blocks;
  try { return new AsyncFunction('S', '$', 'V', 'R', 'P', 'const L = {};\n' + g.list(blocks)); }
  catch (e) { R.log('⚠️ ' + e.message, 'err'); openConsole(); return null; }
}

function compileReporter(t, b) {
  const g = new Gen(t, false);
  try { return new AsyncFunction('S', '$', 'V', 'R', 'P', 'const L = {};\nreturn ' + g.expr(b) + ';'); }
  catch (e) { R.log('⚠️ ' + e.message, 'err'); return null; }
}

function getCompiled(t) { if (!t._c) t._c = compileTarget(t); return t._c; }

function hatLabel(b) {
  const d = BLOCKS[b.type];
  if (b.type === 'ev_flag') return ['onGo', ''];
  if (b.type === 'ev_key') return ['onKey', q(b.a.K)];
  if (b.type === 'ev_click') return ['onClick', ''];
  if (b.type === 'ev_receive') return ['onMessage', q(b.a.M)];
  if (b.type === 'co_clonehat') return ['onCloneStart', ''];
  return [d.hat, ''];
}

function prettyCode(t) {
  const g = new Gen(t, true);
  const prev = CTX.target; CTX.target = t;
  let out = `// ${t.name}’s blocks, written as JavaScript\n// S = ${t.isStage ? 'the stage' : 'this sprite'}, V = variables, R = the Blook Berry Code runtime\n\n`;
  let loose = 0;
  for (const sc of t.scripts) {
    const first = sc.blocks[0];
    if (!first) continue;
    if (first.type === 'fn_def') {
      const fn = g.fnOf(first.a.FN);
      if (!fn) continue;
      out += `async function ${safeId(fn.name, 'f')}(${fn.params.map(p => safeId(p.name, 'p')).join(', ')}) {\n${ind(g.defBody(fn, sc.blocks.slice(1)))}}\n\n`;
      continue;
    }
    const d = BLOCKS[first.type];
    if (d && d.hat) {
      const [fname, arg] = hatLabel(first);
      out += `${fname}(${arg ? arg + ', ' : ''}async () => {\n${ind(g.list(sc.blocks.slice(1)))}});\n\n`;
    } else loose++;
  }
  if (loose) out += `// ${loose} loose stack${loose > 1 ? 's' : ''} without a “when…” block on top won’t run by themselves.\n`;
  CTX.target = prev;
  return out.replace(/^\s*R\.dirty = true;\n/gm, '');
}

// ================= Runtime =================
const STOP = { stop: true };
const V = {};
function fmt(v) {
  if (Array.isArray(v)) return v.map(fmt).join(' ');
  if (typeof v === 'number') { if (!isFinite(v)) return String(v); return String(Math.round(v * 1e6) / 1e6); }
  if (v == null) return '';
  if (typeof v === 'object') { try { return JSON.stringify(v); } catch (e) { return String(v); } }
  return String(v);
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const H = {
  fmt,
  n(x) { if (typeof x === 'number') return isNaN(x) ? 0 : x; if (typeof x === 'boolean') return x ? 1 : 0; if (x == null || x === '') return 0; const v = Number(x); return isNaN(v) ? 0 : v; },
  b(x) { if (typeof x === 'boolean') return x; if (typeof x === 'number') return x !== 0 && !isNaN(x); if (x == null) return false; const s = String(x).toLowerCase(); return !(s === '' || s === '0' || s === 'false'); },
  isNum(x) { if (typeof x === 'number') return !isNaN(x); if (typeof x !== 'string') return false; const s = x.trim(); return s !== '' && !isNaN(Number(s)); },
  cmp(a, b) {
    if (H.isNum(a) && H.isNum(b)) { const x = Number(a), y = Number(b); return x < y ? -1 : x > y ? 1 : 0; }
    const x = fmt(a).toLowerCase(), y = fmt(b).toLowerCase(); return x < y ? -1 : x > y ? 1 : 0;
  },
  eq(a, b) { return H.cmp(a, b) === 0; },
  mod(a, b) { const r = a % b; return r !== 0 && (r < 0) !== (b < 0) ? r + b : r; },
  rand(a, b) {
    a = H.n(a); b = H.n(b); const lo = Math.min(a, b), hi = Math.max(a, b);
    if (Number.isInteger(lo) && Number.isInteger(hi)) return lo + Math.floor(Math.random() * (hi - lo + 1));
    return lo + Math.random() * (hi - lo);
  },
  fn(op, x) {
    const r = Math.PI / 180, fix = (v) => Math.round(v * 1e10) / 1e10;
    switch (op) {
      case 'abs': return Math.abs(x); case 'floor': return Math.floor(x); case 'ceiling': return Math.ceil(x);
      case 'sqrt': return Math.sqrt(x); case 'sin': return fix(Math.sin(x * r)); case 'cos': return fix(Math.cos(x * r));
      case 'tan': return fix(Math.tan(x * r)); case 'asin': return Math.asin(x) / r; case 'acos': return Math.acos(x) / r;
      case 'atan': return Math.atan(x) / r; case 'ln': return Math.log(x); case 'log': return Math.log10(x);
      case 'e ^': return Math.exp(x); case '10 ^': return Math.pow(10, x);
    }
    return 0;
  },
  letter(n, t) { return fmt(t).charAt(H.n(n) - 1); },
  contains(a, b) { return fmt(a).toLowerCase().includes(fmt(b).toLowerCase()); },
  list(name) { let l = V[name]; if (!Array.isArray(l)) { l = V[name] = []; } return l; },
  lidx(l, i) {
    const s = String(i).toLowerCase();
    if (s === 'last') return l.length;
    if (s === 'random' || s === 'any') return l.length ? 1 + Math.floor(Math.random() * l.length) : 0;
    return Math.floor(H.n(i));
  },
  ladd(name, x) { H.list(name).push(x); R.dirty = true; },
  litem(name, i) { const l = H.list(name); const k = H.lidx(l, i); return k >= 1 && k <= l.length ? l[k - 1] : ''; },
  ldel(name, i) { const l = H.list(name); if (i === 'all') l.length = 0; else { const k = H.lidx(l, i); if (k >= 1 && k <= l.length) l.splice(k - 1, 1); } R.dirty = true; },
  lins(name, i, x) { const l = H.list(name); const k = String(i).toLowerCase() === 'last' ? l.length + 1 : H.lidx(l, i); if (k >= 1 && k <= l.length + 1) l.splice(k - 1, 0, x); R.dirty = true; },
  lrep(name, i, x) { const l = H.list(name); const k = H.lidx(l, i); if (k >= 1 && k <= l.length) l[k - 1] = x; R.dirty = true; },
  lindex(name, x) { const l = H.list(name); for (let i = 0; i < l.length; i++) if (H.eq(l[i], x)) return i + 1; return 0; },
  lsort(name, o) { const l = H.list(name); l.sort((a, b) => H.cmp(a, b)); if (o === 'desc') l.reverse(); R.dirty = true; },
  toList(x) { if (Array.isArray(x)) return x.slice(); if (x === '' || x == null) return []; return [x]; },
};

// ----- image cache -----
const IMG = new Map();
function getImg(src) {
  let e = IMG.get(src);
  if (e) return e;
  e = { img: new Image(), ready: false, w: 0, h: 0, alpha: null, bounds: null };
  IMG.set(src, e);
  e.img.onload = () => {
    const w = e.img.naturalWidth || 1, h = e.img.naturalHeight || 1;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.drawImage(e.img, 0, 0);
    let d; try { d = g.getImageData(0, 0, w, h).data; } catch (err) { d = null; }
    const a = new Uint8Array(w * h);
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let i = 0; i < w * h; i++) {
      a[i] = d ? d[i * 4 + 3] : 255;
      if (a[i] > 16) { const x = i % w, y = (i / w) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    e.w = w; e.h = h; e.alpha = a; e.bounds = x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 }; e.ready = true;
    R.dirty = true; if (typeof onImageReady === 'function') onImageReady();
  };
  e.img.src = src;
  return e;
}

// ----- Sprite -----
class Sprite {
  constructor(d) {
    Object.assign(this, { id: uid('s'), name: 'Sprite', x: 0, y: 0, dir: 90, size: 100, visible: true, rot: 'all', costume: 0, costumes: [], scripts: [], functions: [], draggable: true }, d || {});
    this.reset();
  }
  reset() { this.sayText = ''; this.think = false; this.sayTok = 0; this.fx = { ghost: 0, color: 0, brightness: 0 }; this.pen = { down: false, color: '#D6336C', size: 4 }; }
  toJSON() {
    const { id, name, x, y, dir, size, visible, rot, costume, costumes, scripts, functions, draggable } = this;
    return { id, name, x, y, dir, size, visible, rot, costume, costumes, scripts, functions, draggable };
  }
  get cur() { return this.costumes[this.costume] || this.costumes[0] || null; }
  entry() { const c = this.cur; if (!c) return null; const e = getImg(c.src); return e.ready ? e : null; }
  tf(e) {
    const res = (this.cur && this.cur.res) || 1;
    const s = this.size / 100 / res; let th = 0, sx = s;
    if (this.rot === 'all') th = (this.dir - 90) * Math.PI / 180;
    else if (this.rot === 'lr' && this.dir < 0) sx = -s;
    return { cx: 240 + this.x, cy: 180 - this.y, th, sx, sy: s, w: e ? e.w : 0, h: e ? e.h : 0 };
  }
  aabb() {
    const e = this.entry(); const T = this.tf(e);
    if (!e || !e.bounds) return { x0: T.cx - 1, y0: T.cy - 1, x1: T.cx + 1, y1: T.cy + 1 };
    const b = e.bounds, cs = Math.cos(T.th), sn = Math.sin(T.th);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [ix, iy] of [[b.x0, b.y0], [b.x1, b.y0], [b.x0, b.y1], [b.x1, b.y1]]) {
      const lx = (ix - T.w / 2) * T.sx, ly = (iy - T.h / 2) * T.sy;
      const px = T.cx + cs * lx - sn * ly, py = T.cy + sn * lx + cs * ly;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
    }
    return { x0, y0, x1, y1 };
  }
  hit(px, py) {
    if (!this.visible) return false;
    const e = this.entry(); if (!e) return false;
    const T = this.tf(e), dx = px - T.cx, dy = py - T.cy, cs = Math.cos(T.th), sn = Math.sin(T.th);
    const u = cs * dx + sn * dy, v = -sn * dx + cs * dy;
    const ix = Math.floor(u / T.sx + T.w / 2), iy = Math.floor(v / T.sy + T.h / 2);
    if (ix < 0 || iy < 0 || ix >= e.w || iy >= e.h) return false;
    return e.alpha[iy * e.w + ix] > 16;
  }
  // motion
  move(n) { const r = (90 - this.dir) * Math.PI / 180; n = H.n(n); this.goTo(this.x + n * Math.cos(r), this.y + n * Math.sin(r)); }
  turn(d) { this.setDir(this.dir + H.n(d)); }
  setDir(d) { d = H.n(d); d = (((d + 180) % 360) + 360) % 360 - 180; if (d === -180) d = 180; this.dir = d; R.redraw = true; }
  goTo(x, y) {
    x = H.n(x); y = H.n(y);
    const ox = this.x, oy = this.y;
    this.x = x; this.y = y; this.fence();
    if (this.pen.down) R.penLine(ox, oy, this.x, this.y, this.pen);
    R.redraw = true;
  }
  fence() {
    const b = this.aabb(); const w = b.x1 - b.x0, hh = b.y1 - b.y0;
    const ix = Math.min(15, w / 2), iy = Math.min(15, hh / 2);
    let dx = 0, dy = 0;
    if (b.x1 < ix) dx = ix - b.x1; else if (b.x0 > 480 - ix) dx = 480 - ix - b.x0;
    if (b.y1 < iy) dy = iy - b.y1; else if (b.y0 > 360 - iy) dy = 360 - iy - b.y0;
    this.x += dx; this.y -= dy;
  }
  pointOf(id) {
    if (id === '_random_') return [Math.round(Math.random() * 480 - 240), Math.round(Math.random() * 360 - 180)];
    if (id === '_mouse_') return [R.mouseX, R.mouseY];
    const s = R.spriteById(id); return s ? [s.x, s.y] : null;
  }
  goToTarget(id) { const p = this.pointOf(id); if (p) this.goTo(p[0], p[1]); }
  async glide($, secs, x, y) {
    secs = H.n(secs); x = H.n(x); y = H.n(y);
    const sx = this.x, sy = this.y, t0 = performance.now(), dur = secs * 1000;
    if (dur <= 0) { this.goTo(x, y); return; }
    for (;;) {
      const k = Math.min(1, (performance.now() - t0) / dur);
      this.goTo(sx + (x - sx) * k, sy + (y - sy) * k);
      if (k >= 1) break;
      await $.frame();
    }
  }
  async glideTo($, secs, id) { const p = this.pointOf(id); if (p) await this.glide($, secs, p[0], p[1]); }
  towards(id) {
    const p = id === '_random_' ? null : this.pointOf(id); if (!p) return;

  const c = i == null ? null : list[i];
  const name = c ? c.name : (t ? uniqueCostumeName(list, kind === 'backdrop' ? 'backdrop' : 'costume') : 'costume');
  let start;
  try { start = await studioDocFor(c, kind, name); } catch (e) { toast('That costume couldn’t be opened.'); return; }

}
function artSaved(t, old, r, opts) {
  const artId = (old && old.artId) || uid('a');
  project.art[artId] = r.doc;
  const many = r.images.length > 1;
  const fresh = r.images.map((img, n) => ({ id: uid('c'), name: many ? `${r.name}${n + 1}` : r.name, src: img.src, res: r.res, artId, frame: img.frame }));

    return;
  }
  const list = costumeList(t);

  else {
    const group = many && old.artId ? list.filter(x => x.artId === old.artId) : [old];
    at = list.indexOf(group[0]);

    if (!many && old.name !== fresh[0].name) { fresh[0].name = uniqueCostumeName(list, fresh[0].name, fresh[0]); renameCostumeRefs(t, old.name, fresh[0].name); }
    if (!many) fresh[0].id = old.id;

  setCurCostume(t, at);
  R.redraw = true; scheduleSave();
  renderCostumes(); renderSpriteList(); updateWho(); refreshBlocks();
  toast(many ? `Saved ${fresh.length} costumes. Use “next costume” to play them.` : `${t.isStage ? 'Backdrop' : 'Costume'} saved.`);
}

const TAGS = [['game', 'Games'], ['animation', 'Animations'], ['art', 'Art'], ['music', 'Music'], ['story', 'Stories'], ['sim', 'Simulations'], ['tutorial', 'How-tos']];
const TAG_NAME = Object.fromEntries(TAGS);

async function startDiscover() {
  if (DX.started) return;
  DX.started = true;
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { DX.ready = true; DX.err = 'outside'; renderDiscover(); return; }
  try { const [db, user] = await Promise.all([c.use('db'), c.use('user')]); DX.db = db; DX.user = user; } catch (e) { DX.db = null; }
  if (!DX.db) { DX.ready = true; DX.err = 'nodb'; renderDiscover(); return; }
  if (DX.user) {
    try { DX.uid = await DX.user.id(); DX.isOwner = await DX.user.isOwner(); DX.canWrite = await DX.user.can('data.write'); } catch (e) {}
  }
  const slow = setTimeout(() => { DX.slow = true; renderDiscover(); }, 10000);
  const fail = (e) => { clearTimeout(slow); DX.err = (e && e.code) || 'unavailable'; renderDiscover(); };
  const fresh = (snap) => { if (!snap.metadata.fromCache) { clearTimeout(slow); DX.fresh = true; DX.slow = false; } };
  DX.db.collection('gallery').orderBy('updated', 'desc').limit(300).onSnapshot((snap) => {
    DX.gallery = new Map(snap.docs.map(d => [d.id, Object.assign({ id: d.id }, d.data())])); fresh(snap); DX.ready = true; queueDiscover();
  }, fail);
  DX.db.collection('likes').limit(1000).onSnapshot((snap) => { DX.likes = snap.docs.map(d => d.data()); queueDiscover(); }, () => {});
  DX.db.collection('plays').limit(1000).onSnapshot((snap) => { DX.plays = snap.docs.map(d => d.data()); queueDiscover(); }, () => {});
  DX.db.collection('profiles').limit(500).onSnapshot((snap) => { DX.profiles = new Map(snap.docs.map(d => [d.id, d.data()])); queueDiscover(); updateMeChip(); }, () => {});
}

const AV_COLORS = {
  berry: ['#E0336B', '#A61E55', '#FF8FB1'], orange: ['#F76707', '#C2410C', '#FFB27A'], sun: ['#F5B700', '#B07D00', '#FFE48A'],
  lime: ['#74B816', '#4E7F0E', '#B8E986'], mint: ['#12B886', '#087F5B', '#8CE9C8'], sky: ['#339AF0', '#1864AB', '#A5D8FF'],
  grape: ['#845EF7', '#5F3DC4', '#C9B6FF'], night: ['#495057', '#212529', '#ADB5BD'],
};
const AV_FACES = ['happy', 'wink', 'cool', 'wow', 'silly'];
const avCache = new Map();
function avatarSrc(av) {
  const color = AV_COLORS[av && av.color] ? av.color : 'berry', face = AV_FACES.includes(av && av.face) ? av.face : 'happy';
  const key = color + face;
  if (avCache.has(key)) return avCache.get(key);
  const rows = BERRY.slice();
  if (face === 'wink') rows[7] = 'rprrrrrrrrwkrrRR';
  if (face === 'cool') { rows[7] = 'rprkkkkkkkkkkrRR'; rows[8] = 'rrrkkkrrrrkkkrRR'; }
  if (face === 'wow') { rows[10] = '.rrrrrrkkrrrrrR.'; rows[11] = '.rRrrrrkkrrrrrR.'; }
  if (face === 'silly') rows[12] = '..rRyrrpprrryR..';
  const [m, d, l] = AV_COLORS[color];
  const pal = Object.assign({}, BERRY_PAL, { r: m, R: d, p: l });
  const src = exportPixels(16, 16, rows.join('').split('').map(ch => pal[ch] || ''), 64, 64);
  avCache.set(key, src);
  return src;
}

// ----- ranking -----
function ageDays(p) { return Math.max(0, (Date.now() - (p.created || p.updated || Date.now())) / 86400000); }
function trendScore(p) { return (likeCount(p.id) * 3 + playCount(p.id) + 1) / Math.pow(ageDays(p) + 2, 1.3); }
function tagAffinity() {
  const aff = {};
  const add = (pid, w) => { const p = DX.gallery.get(pid); if (p) for (const t of p.tags || []) aff[t] = (aff[t] || 0) + w; };
  for (const l of DX.likes) if (l.uid === DX.uid) add(l.pid, 3);
  for (const l of DX.plays) if (l.uid === DX.uid) add(l.pid, 1);
  for (const p of DX.gallery.values()) if (p.author === DX.uid) for (const t of p.tags || []) aff[t] = (aff[t] || 0) + 2;
  return aff;
}
function recommended(all) {
  const aff = tagAffinity();
  const hasTaste = Object.keys(aff).length > 0;
  return all.filter(p => p.author !== DX.uid && !likedByMe(p.id)).map(p => {
    const taste = (p.tags || []).reduce((s, t) => s + (aff[t] || 0), 0);
    const pop = Math.log1p(likeCount(p.id)) * 1.5 + Math.log1p(playCount(p.id));
    const fresh = 2 * Math.pow(0.5, ageDays(p) / 7);
    return { p, score: (hasTaste ? taste * 1.4 : 0) + pop + fresh - (playedByMe(p.id) ? 1.5 : 0) + Math.random() * 0.4 };
  }).sort((a, b) => b.score - a.score).map(x => x.p);
}
function matches(p, q) {
  const a = authorOf(p);
  const hay = [p.title, p.desc, a.username, ...(p.tags || []).map(t => TAG_NAME[t] || t)].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

async function publishProject(pid, meta, old) {
  const json = serialize();
  if (json.length > 4000000) throw new Error('too big');
  const CH = 90000, n = Math.ceil(json.length / CH);
  for (let i = 0; i < n; i++) await DX.db.doc(`gallery/${pid}/data/${i}`).set({ s: json.slice(i * CH, (i + 1) * CH) });
  if (old && old.chunks > n) for (let i = n; i < old.chunks; i++) await DX.db.doc(`gallery/${pid}/data/${i}`).delete().catch(() => {});
  const now = Date.now();
  await DX.db.doc(`gallery/${pid}`).set({
    title: meta.title.slice(0, 60), desc: meta.desc.slice(0, 400), tags: meta.tags.slice(0, 3), thumb: meta.thumb, author: DX.uid,
    created: old ? old.created || now : now, updated: now, chunks: n, v: 1,
    remixOf: project.remixOf ? project.remixOf.pid : null, remixOfTitle: project.remixOf ? project.remixOf.title.slice(0, 60) : null,
  });
  project.share = { pid };
  saveNow();
}

async function claimUsername(u) {
  const lc = u.toLowerCase();
  for (const [id, pr] of DX.profiles) if (id !== DX.uid && (pr.username || '').toLowerCase() === lc) return false;
  const ref = DX.db.doc('usernames/' + lc);
  const lease = await ref.acquire({ holder: segId(DX.uid), ttlMs: 5000 });
  if (!lease.acquired) return false;
  const snap = await ref.get();
  const owner = snap.exists ? (snap.data() || {}).uid : null;
  if (owner && owner !== DX.uid) return false;
  await ref.set({ uid: DX.uid, name: u });
  return true;
}

  catch (e) { dbProblem(e); }
}

async function tutSvgCostume(svg, name) {
  const m = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const w = +m[1], hh = +m[2];
  const doc = svg.replace('<svg', `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hh}"`);
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(doc);
  try {
    const img = await loadImg(src);
    const c = document.createElement('canvas'); c.width = w * 2; c.height = hh * 2;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { id: uid('c'), name, src: c.toDataURL('image/png'), res: 2 };
  } catch (e) { return { id: uid('c'), name, src, res: 1 }; }
}

function TB(op, args, DO, ELSE) {
  const b = mk(op);
  for (const [k, v] of Object.entries(args || {})) {
    if (v && typeof v === 'object' && v.type) b.r[k] = v;
    else b.a[k] = tutRef(v);

  if (DO) b.s.DO = DO;
  if (ELSE) b.s.ELSE = ELSE;
  return b;
}
function tutRef(v) {
  const s = String(v);
  if (s[0] !== '@') return s;
  const t = tutSprite(s.slice(1));
  return t ? t.id : s.slice(1);
}

// ----- saved progress -----
const tutKey = () => 'codeberry:tut:' + (project && project.id);
function tutLoad() { try { return JSON.parse(localStorage.getItem(tutKey()) || 'null'); } catch (e) { return null; } }
function tutStore(st) { try { if (st) localStorage.setItem(tutKey(), JSON.stringify(st)); else localStorage.removeItem(tutKey()); } catch (e) {} }
function tutDone() { try { return new Set(JSON.parse(localStorage.getItem('codeberry:tutsdone') || '[]')); } catch (e) { return new Set(); } }
function tutMarkDone(id) { const s = tutDone(); s.add(id); try { localStorage.setItem('codeberry:tutsdone', JSON.stringify([...s])); } catch (e) {} }

function tutSprite(name) {
  if (name === 'Stage') return project.stage;
  const ids = (TUT.cur && TUT.cur.ids) || {};
  return project.sprites.find(s => s.id === ids[name]) || project.sprites.find(s => s.name === name) || null;
}

// ----- checking the learner's code -----
function tutFlat(list, out) {
  for (const b of list || []) {
    out.push(b);
    for (const r of Object.values(b.r || {})) if (r) tutFlat([r], out);
    for (const l of Object.values(b.s || {})) tutFlat(l, out);
  }
  return out;
}
function tutMatch(b, o) {
  if (typeof o === 'string') return b.type === o;
  if (b.type !== o.op) return false;
  for (const [k, v] of Object.entries(o)) {
    if (k === 'op' || k === 'has') continue;
    if (String((b.a || {})[k] ?? '').trim().toLowerCase() !== String(tutRef(v)).trim().toLowerCase()) return false;
  }
  if (o.has && o.has.length) {
    const inner = tutFlat(Object.values(b.s || {}).flat(), []);
    if (!o.has.every(x => inner.some(c => tutMatch(c, x)))) return false;
  }
  return true;
}
const TUT_CHECK = {
  hasVar: (n) => project.variables.some(v => v.toLowerCase() === n.toLowerCase()),
  has: (name, ...ops) => { const t = tutSprite(name); if (!t) return false; const all = tutFlat(t.scripts.flatMap(s => s.blocks), []); return ops.every(o => all.some(b => tutMatch(b, o))); },
  stack: (name, ...ops) => { const t = tutSprite(name); return !!t && t.scripts.some(sc => { const all = tutFlat(sc.blocks, []); return ops.every(o => all.some(b => tutMatch(b, o))); }); },
  script: (name, hat, ...ops) => {
    const t = tutSprite(name); if (!t) return false;
    return t.scripts.some(sc => {
      const f = sc.blocks[0]; if (!f || !tutMatch(f, hat)) return false;
      const all = tutFlat(sc.blocks.slice(1), []);
      return ops.every(o => all.some(b => tutMatch(b, o)));
    });
  },
};
function tutStepPassed(step) { try { return !!(step.check && step.check(TUT_CHECK)); } catch (e) { return false; } }

// ----- starting a tutorial -----
async function tutorialProject(T) {
  const S = T.setup || {};
  const stage = new Stage({ color: (S.stage && S.stage.color) || '#FFFFFF' });
  const sprites = [], ids = {};
  for (const sp of S.sprites || []) {
    let s;
    if (sp.berry) s = makeBerry('Berry');
    else if (sp.blue) s = new Sprite({ name: sp.name, costumes: [tintedBerry('blueberry', BERRY, ['#339AF0', '#1864AB', '#A5D8FF']), tintedBerry('wink', BERRY_WINK, ['#339AF0', '#1864AB', '#A5D8FF'])] });
    else s = new Sprite({ name: sp.name, costumes: [await tutSvgCostume(TUT_SVG[sp.svg], sp.svg)] });
    if (sp.name) s.name = sp.name;
    Object.assign(s, { x: sp.x || 0, y: sp.y || 0, size: sp.size || 100, dir: sp.dir || 90, rot: sp.rot || 'all' });
    sprites.push(s); ids[s.name] = s.id;
  }
  const first = sprites.find(s => s.name === (S.select || '')) || sprites[0];
  return {
    project: { id: uid('p'), name: T.title, stage, sprites, variables: [], lists: [], messages: ['message1', ...(S.messages || [])], selected: first ? first.id : 'stage', art: {}, looks: {}, share: null, remixOf: null },
    ids,
  };
}
async function startTutorial(T) {
  await saveNow();
  R.stopAll(); R.penClear();
  for (const k of Object.keys(V)) delete V[k];
  R.monitors = new Set(); R.layers = [];
  const { project: p, ids } = await tutorialProject(T);
  project = p; CTX.target = curTarget();
  tutStore({ id: T.id, step: 0, ids });
  applyProject(); renderAll();
  setView('create');
  if (isNarrow()) setTab('code');
  saveNow();
}

// ----- the step card -----
function tutText(text) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc(text).replace(/\*\*([^*]+)\*\*/g, (m, w) => {
    const cat = CATS.find(c => c.name.toLowerCase() === w.toLowerCase());
    if (cat) return `<span class="tut-cat" style="--c:${cat.color}">${icon(cat.id)}${cat.name}</span>`;
    return `<b>${w}</b>`;
  });
}
function tutPicture(step, t) {
  if (!step.blocks) return null;
  const prev = CTX.target; CTX.target = t || curTarget();
  let stacks = [];
  try { stacks = step.blocks(); } catch (e) { stacks = []; }
  const pic = h('div', { class: 'tut-pic', inert: true, 'aria-hidden': 'true' });
  for (const st of stacks) {
    const col = h('div', { class: 'tut-stack' });
    for (const b of st) col.append(renderBlock(b, 'tut'));
    pic.append(col);
  }
  CTX.target = prev;
  return pic;
}
function tutSave() { const c = TUT.cur; if (c) tutStore({ id: c.T.id, step: c.step, ids: c.ids, min: c.min }); }
function tutSync() {
  if (!project || project.temp) { TUT.cur = null; renderTutCard(); return; }
  const st = tutLoad();
  const T = st && TUTS.find(x => x.id === st.id);
  TUT.cur = T ? { T, step: clamp(st.step | 0, 0, T.steps.length), ids: st.ids || {}, min: !!st.min, passed: -1 } : null;
  renderTutCard();
}
function tutGo(step) {
  const c = TUT.cur; if (!c) return;
  c.step = clamp(step, 0, c.T.steps.length);
  c.passed = -1;
  if (c.step === c.T.steps.length) tutMarkDone(c.T.id);
  const want = c.T.steps[c.step] && c.T.steps[c.step].sprite;
  const t = want && tutSprite(want);
  if (t && t !== curTarget()) selectTarget(t.id);
  tutSave(); renderTutCard();
}
function tutClose() { tutStore(null); TUT.cur = null; renderTutCard(); toast('Find more any time under Tutorials.'); }
function tutMin(on) { if (!TUT.cur) return; TUT.cur.min = on; tutSave(); renderTutCard(); }

function renderTutCard() {
  if (!ui.tutCard) {
    ui.tutCard = h('aside', { class: 'tut-card', 'aria-label': 'Tutorial' });
    document.body.append(ui.tutCard);
    ui.tutCard.addEventListener('pointerdown', tutDragStart);
  }
  const card = ui.tutCard, c = TUT.cur;
  card.innerHTML = '';
  card.hidden = !c;
  document.body.classList.toggle('tut-open', !!c);

    h('button', { 'data-tab': 'learn', onclick: () => openTutorials(), html: icon('learn') + '<span>Learn</span>' }), tab('discover', 'compass', 'Discover'));
  ui.plTitle = h('b'); ui.plBy = h('span', { class: 'pl-by' });
  ui.plLike = h('button', { class: 'btn like', 'aria-label': 'Like', html: icon('heart') + '<span>0</span>', onclick: async () => { if (!player || !player.pid) return; await toggleLike(player.pid); ui.plLike.classList.toggle('on', likedByMe(player.pid)); ui.plLike.querySelector('span').textContent = likeCount(player.pid); } });
  ui.plRemix = h('button', { class: 'btn', html: icon('remix') + '<span>Remix</span>', onclick: () => { const g = player && DX.gallery.get(player.pid); if (g) remixCurrent(g); } });
  ui.plStage = h('div', { class: 'pl-stage' }); ui.plKeys = h('div', { class: 'pl-keys' });
  ui.player = h('div', { class: 'player', role: 'dialog', 'aria-label': 'Playing' },
    h('div', { class: 'pl-top' },
      h('button', { class: 'btn', onclick: closePlayer, html: icon('back') + '<span>Back</span>' }),
      h('div', { class: 'pl-name' }, ui.plTitle, ui.plBy),
      h('div', { class: 'pl-acts' }, ui.plLike, ui.plRemix,
        h('button', { class: 'go', 'aria-label': 'Go', html: PLAY + '<span>Go</span>', onclick: () => R.greenFlag() }),
        h('button', { class: 'stop', 'aria-label': 'Stop', onclick: () => R.stopAll() }, h('span')))),
    ui.plStage, ui.plKeys);
  ui.dragLayer = h('div', { id: 'dragLayer' });
  ui.insMark = h('div', { id: 'insMark', hidden: true });
  ui.toast = h('div', { id: 'toast', role: 'status' });
  ui.modalRoot = h('div', { id: 'modalRoot' });
  document.body.append(header, main, ui.tabs, ui.player, ui.dragLayer, ui.insMark, ui.toast, ui.modalRoot);
  buildDiscoverUI();
  penCanvas = document.createElement('canvas'); penCanvas.width = 960; penCanvas.height = 720; penCtx = penCanvas.getContext('2d');
  ctx2 = cv.getContext('2d');
}

function wireEvents() {
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);
  ui.palette.addEventListener('scroll', onPaletteScroll, { passive: true });
  ui.ws.addEventListener('pointerdown', (e) => { if (!e.target.closest('.blk') && isNarrow()) closePalette(); });
  ui.ws.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    const el = e.target.closest('.blk');
    if (el && el.closest('#wsInner')) blockMenu(el, e.clientX, e.clientY);
    else showMenu(e.clientX, e.clientY, [['Tidy up blocks', cleanUp], ['Make a block', () => editFunction(null)]]);
  });
  // mouse-drag on empty workspace pans it
  let pan = null;
  ui.ws.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.button === 0 && !e.target.closest('.blk')) pan = { x: e.clientX, y: e.clientY, l: ui.ws.scrollLeft, t: ui.ws.scrollTop }; });
  window.addEventListener('pointermove', (e) => { if (pan) { ui.ws.scrollLeft = pan.l - (e.clientX - pan.x); ui.ws.scrollTop = pan.t - (e.clientY - pan.y); } });
  window.addEventListener('pointerup', () => { pan = null; });
  ui.ws.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(wsZoom * (e.deltaY < 0 ? 1.1 : 0.9)); } }, { passive: false });

  cv.addEventListener('pointerdown', onStageDown);
  cv.addEventListener('pointermove', onStageMove);
  cv.addEventListener('pointerup', onStageUp);
  cv.addEventListener('pointercancel', onStageUp);
  ui.askIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); R.submitAsk(ui.askIn.value); } });

  ui.goBtn.addEventListener('click', () => { if (isNarrow() && document.body.dataset.tab === 'code') setTab('stage'); R.greenFlag(); });
  ui.stopBtn.addEventListener('click', () => R.stopAll());
  ui.codeBtn.addEventListener('click', showCode);
  ui.tutBtn.addEventListener('click', () => openTutorials());
  ui.menuBtn.addEventListener('click', () => { const r = ui.menuBtn.getBoundingClientRect(); showMenu(r.right - 210, r.bottom + 6, [['My projects', openMyProjects], ['New project', newProject], ['How Blook Berry Code works', about]]); });
  ui.projName.addEventListener('input', () => { project.name = ui.projName.value; scheduleSave(); });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && player && !ui.modalRoot.children.length) closePlayer(); });

  const typing = (e) => e.target && e.target.closest && e.target.closest('input, select, textarea, [contenteditable]');
  window.addEventListener('keydown', (e) => {
    if (typing(e) || ui.modalRoot.children.length || e.ctrlKey || e.metaKey || e.altKey) return;
    if (typeof ArtStudio !== 'undefined' && ArtStudio.isOpen()) return;
    const k = keyName(e); if (!k) return;
    if (k === 'space' || k.endsWith('arrow')) e.preventDefault();
    R.keyPress(k);
  });
  window.addEventListener('keyup', (e) => { const k = keyName(e); if (k) R.keyRelease(k); });
  window.addEventListener('blur', () => R.keys.clear());
  new ResizeObserver(resizeStage).observe(ui.stageWrap);
  window.addEventListener('resize', () => { if (!isNarrow()) closePalette(); sizeWorkspace(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);
}

async function init() {
  buildUI();
  if (typeof ArtStudio !== 'undefined') ArtStudio.setTextFont('Titan One', TITAN_ONE_B64);
  let ok = false;
  let saved = null;
  try { const cur = await dbGet('current'); if (cur) saved = await dbGet('proj:' + cur); } catch (e) { saved = null; }
  if (!saved) { try { saved = await dbGet(SAVE_KEY); } catch (e) { saved = null; } }
  if (!saved) { try { saved = localStorage.getItem(SAVE_KEY); } catch (e) { saved = null; } }
  if (saved) { try { loadProject(saved); ok = true; } catch (e) { ok = false; } }
  if (!ok) starterProject();
  applyProject();
  if (isNarrow()) wsZoom = 0.9;
  document.body.dataset.view = 'create';
  wireEvents();
  renderAll();
  tutSync();
  resizeStage();
  requestAnimationFrame(frameLoop);
  if (!ok) setTimeout(() => toast('Press Go to run Berry’s code, or open Tutorials to learn step by step.'), 600);
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
